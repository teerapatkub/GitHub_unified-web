name: Repository safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test repository safety rules
        run: node --test scripts/security/*.test.mjs

      - name: Scan tracked files and Git history
        run: node scripts/security/repository-safety.mjs

      - name: Build production image
        run: docker build --tag pyarena-repository-safety .

      - name: Inspect production image contents
        run: node scripts/security/container-image-safety.mjs pyarena-repository-safety
