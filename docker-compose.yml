# The whole system on one machine we run ourselves (Spec 0004): the app (API +
# built front end + the Python that grades answers) and a local language model
# (Ollama). The database, sign-in and file storage stay on Supabase.
#
#   docker compose --env-file server/.env.production.local build
#   docker compose --env-file server/.env.production.local up -d
#   (with an NVIDIA GPU, add: -f docker-compose.yml -f docker-compose.gpu.yml)
#   → http://127.0.0.1:3001 on this machine only
#
# Build first, then start. With `up --build` the image build (npm, Vite) runs
# while the model loads and warms up, and part of the model runs on the CPU, so
# the first answers took 45-54 s instead of 5-15 s (measured 2026-10-22 and
# 2026-10-25; with nothing else running the first answer took 6.5 s even from
# a cold disk cache).
#
# Every setting comes from that one env file, which git never tracks: Supabase
# (DATABASE_URL, SUPABASE_URL, SUPABASE_SECRET_KEY, SUPABASE_PUBLISHABLE_KEY),
# the public address (PUBLIC_BASE_URL, AUTH_ALLOWED_ORIGINS) and the models
# (LLM_CHAT_MODEL, LLM_JUDGE_MODEL, LLM_ADVICE_MODEL). Compose fills in the build
# arguments and the values below from --env-file, and the app reads the whole
# file through env_file. To use another file (a test database, say), set
# PYARENA_ENV_FILE to it AND pass the same path as --env-file, or the app and
# the build will be configured from two different files.
#
# Never run `docker compose config` without --quiet: it prints every secret in
# the env file.

services:
  ollama:
    image: ollama/ollama:0.30.0
    volumes:
      # Models are a few GB; they are pulled once and outlive the container.
      - ollama-models:/root/.ollama
    environment:
      # One answer at a time: a 4 GB GPU holds one 4B model with one context.
      # Further requests wait in Ollama's queue (503 once it is full).
      OLLAMA_NUM_PARALLEL: "1"
      # Keep the model loaded: loading it again costs 50-90 s.
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      # An 8-bit context cache (needs flash attention) halves its memory. On a
      # 4 GB laptop GPU under Windows the 4B model still runs ~30% on the CPU
      # (3.4-3.5 GB against ~3.2 GB free); warm it answers at ~14 tokens/s
      # (measured 2026-10-22).
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Pulls every model the env file names, loads the chat model into memory, and
  # exits. Loading takes 50-90 s on a 4 GB laptop GPU; a player's first question
  # should not be the one that pays for it. A job whose model is left empty is
  # switched off and skipped here. A load that fails or hangs gives up after
  # five minutes without holding the app back: the app then answers with its
  # local fallbacks until the model is up.
  ollama-pull:
    image: ollama/ollama:0.30.0
    depends_on:
      ollama:
        condition: service_healthy
    # Only the model names - not the env file, which holds the database password.
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL-}
      LLM_JUDGE_MODEL: ${LLM_JUDGE_MODEL-}
      LLM_ADVICE_MODEL: ${LLM_ADVICE_MODEL-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for model in "$$LLM_CHAT_MODEL" "$$LLM_JUDGE_MODEL" "$$LLM_ADVICE_MODEL"; do
          [ -z "$$model" ] || ollama pull "$$model" || exit 1
        done
        [ -z "$$LLM_CHAT_MODEL" ] || timeout 300 ollama run "$$LLM_CHAT_MODEL" "ok" > /dev/null || true
    restart: "no"

  uploads-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /data/uploads"]
    volumes:
      - pysim-uploads:/data/uploads
    restart: "no"

  app:
    build:
      context: .
      args:
        # Empty on purpose: the API serves the front end, so the browser talks
        # to the same origin it loaded the page from.
        VITE_API_BASE_URL: ""
        # Public browser configuration is embedded at build time, so these
        # come from the compose --env-file, never from a file in the image.
        VITE_SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in the compose env file}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in the compose env file}
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      uploads-init:
        condition: service_completed_successfully
    env_file:
      - ${PYARENA_ENV_FILE:-server/.env.production.local}
    environment:
      PORT: 3001
      UPLOADS_DIR: /data/uploads
      ASSET_STORAGE_BUCKET: ${ASSET_STORAGE_BUCKET:-uploads}
      # The Ollama service by default. Set LLM_BASE_URL= (empty) in the env file
      # to run with every AI job off.
      LLM_BASE_URL: ${LLM_BASE_URL-http://ollama:11434/v1}
      # Required, with no default: the image runs with NODE_ENV=production,
      # whose startup check accepts only an exact public HTTPS origin (no
      # localhost, no path). AUTH_ALLOWED_ORIGINS must include it too.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL to the public HTTPS origin}
      CLIENT_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL to the public HTTPS origin}
    ports:
      # This machine only. Players come in through the public way in (Tailscale
      # Funnel or the university's reverse proxy), never straight to this port.
      - "127.0.0.1:${PORT:-3001}:3001"
    volumes:
      # Admin uploads go to Supabase Storage; this volume is the app's local
      # upload directory (UPLOADS_DIR), which production still requires.
      - pysim-uploads:/data/uploads
    restart: unless-stopped

volumes:
  ollama-models:
  pysim-uploads:
