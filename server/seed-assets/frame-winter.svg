<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="กรอบโปรไฟล์เกล็ดหิมะ">
  <title>กรอบเกล็ดหิมะ — Snowflake Frame</title>
  <!-- An icy ring with snow piled on top and icicles under it. The snowflakes
       turn slowly and twinkle (SMIL). -->
  <defs>
    <linearGradient id="wfIce" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/><stop offset="50%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <g id="wfFlake" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M0 -11 V11 M-9.5 -5.5 L9.5 5.5 M-9.5 5.5 L9.5 -5.5 M-3 -8 L0 -5 L3 -8 M-3 8 L0 5 L3 8"/>
    </g>
  </defs>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#0c4a6e" stroke-width="13" opacity="0.35"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#wfIce)" stroke-width="9"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7" stroke-dasharray="2 6"/>
  <path d="M38 40 Q46 18 70 14 Q86 6 100 10 Q116 4 132 14 Q156 18 162 40 Q150 30 130 28 Q116 22 100 24 Q84 20 70 28 Q50 28 38 40Z" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <g fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5">
    <path d="M64 30 L68 46 L72 30Z"/><path d="M86 25 L90 44 L94 25Z"/><path d="M110 25 L113 40 L116 25Z"/><path d="M128 28 L132 48 L136 29Z"/>
  </g>
  <g transform="translate(16 100)"><g stroke="#38bdf8"><use href="#wfFlake"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/></g></g>
  <g transform="translate(184 100)"><g stroke="#38bdf8"><use href="#wfFlake"/><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/></g></g>
  <g transform="translate(48 164)"><g stroke="#0ea5e9"><use href="#wfFlake"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/></g></g>
  <g transform="translate(152 164)"><g stroke="#0ea5e9"><use href="#wfFlake"/><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/></g></g>
  <g transform="translate(100 186)">
    <circle cy="-4" r="9" fill="#ffffff" stroke="#7dd3fc" stroke-width="2"/>
    <circle cy="-18" r="6.5" fill="#ffffff" stroke="#7dd3fc" stroke-width="2"/>
    <rect x="-7" y="-14" width="14" height="3" fill="#ef4444"/>
    <rect x="-5" y="-30" width="10" height="7" fill="#1e293b"/><rect x="-7.5" y="-24" width="15" height="2" fill="#1e293b"/>
    <circle cx="-2" cy="-19" r="1" fill="#1e293b"/><circle cx="2" cy="-19" r="1" fill="#1e293b"/>
  </g>
  <g fill="#ffffff" stroke="#7dd3fc" stroke-width="0.8">
    <path d="M30 60 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2Z"><animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/></path>
    <path d="M166 62 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2Z"><animate attributeName="opacity" values="1;0;1" dur="2.6s" repeatCount="indefinite"/></path>
    <path d="M174 140 l1.5 -4.5 l1.5 4.5 l4.5 1.5 l-4.5 1.5 l-1.5 4.5 l-1.5 -4.5 l-4.5 -1.5Z"><animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/></path>
  </g>
</svg>
