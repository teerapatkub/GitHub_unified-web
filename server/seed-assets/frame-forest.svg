<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="กรอบโปรไฟล์เถาวัลย์">
  <title>กรอบเถาวัลย์ — Forest Vine Frame</title>
  <!-- A vine wound round the avatar. Its leaves sway and a ladybird walks
       round it (SMIL). -->
  <defs>
    <path id="ffLeaf" d="M0 0 C6 -6 16 -6 22 0 C16 6 6 6 0 0Z"/>
  </defs>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#7c4a26" stroke-width="8"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#4d7c0f" stroke-width="5" stroke-dasharray="26 10"/>
  <g stroke="#3f6212" stroke-width="1.5">
    <g transform="translate(40 40) rotate(-40)"><use href="#ffLeaf" fill="#65a30d"><animateTransform attributeName="transform" type="rotate" values="-12;14;-12" dur="2.8s" repeatCount="indefinite"/></use></g>
    <g transform="translate(160 40) rotate(-140)"><use href="#ffLeaf" fill="#65a30d"><animateTransform attributeName="transform" type="rotate" values="10;-14;10" dur="3.1s" repeatCount="indefinite"/></use></g>
    <g transform="translate(18 110) rotate(170)"><use href="#ffLeaf" fill="#84cc16"><animateTransform attributeName="transform" type="rotate" values="-10;12;-10" dur="2.5s" repeatCount="indefinite"/></use></g>
    <g transform="translate(182 100) rotate(10)"><use href="#ffLeaf" fill="#84cc16"><animateTransform attributeName="transform" type="rotate" values="12;-10;12" dur="2.9s" repeatCount="indefinite"/></use></g>
    <g transform="translate(100 16) rotate(-90)"><use href="#ffLeaf" fill="#65a30d"><animateTransform attributeName="transform" type="rotate" values="-8;10;-8" dur="3.3s" repeatCount="indefinite"/></use></g>
    <g transform="translate(66 22) rotate(-120)"><use href="#ffLeaf" fill="#eab308"><animateTransform attributeName="transform" type="rotate" values="8;-12;8" dur="2.6s" repeatCount="indefinite"/></use></g>
    <g transform="translate(134 22) rotate(-60)"><use href="#ffLeaf" fill="#ea580c"><animateTransform attributeName="transform" type="rotate" values="-10;10;-10" dur="3s" repeatCount="indefinite"/></use></g>
  </g>
  <g transform="translate(40 170)">
    <rect x="-6" y="-14" width="12" height="18" rx="4" fill="#fef3c7" stroke="#78350f" stroke-width="2.5"/>
    <path d="M-22 -12 Q-22 -36 0 -37 Q22 -36 22 -12Z" fill="#ef4444" stroke="#78350f" stroke-width="2.5"/>
    <circle cx="-9" cy="-24" r="3.6" fill="#ffffff"/><circle cx="8" cy="-28" r="3" fill="#ffffff"/>
  </g>
  <g transform="translate(160 172)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6;6;-6" dur="3.4s" repeatCount="indefinite"/>
      <path d="M0 0 V-14" stroke="#4d7c0f" stroke-width="3"/>
      <g fill="#fde047" stroke="#ca8a04" stroke-width="1.5">
        <circle cx="0" cy="-26" r="6"/><circle cx="-9" cy="-19" r="6"/><circle cx="9" cy="-19" r="6"/><circle cx="-6" cy="-10" r="6"/><circle cx="6" cy="-10" r="6"/>
      </g>
      <circle cx="0" cy="-18" r="5" fill="#ea580c"/>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="24s" repeatCount="indefinite"/>
    <g transform="translate(184 100)">
      <ellipse rx="6" ry="7" fill="#dc2626" stroke="#450a0a" stroke-width="1.5"/>
      <path d="M0 -7 V7" stroke="#450a0a" stroke-width="1.2"/>
      <circle cx="-2.5" cy="-1" r="1.4" fill="#450a0a"/><circle cx="2.5" cy="2" r="1.4" fill="#450a0a"/>
      <circle cx="0" cy="-8" r="2.6" fill="#450a0a"/>
    </g>
  </g>
</svg>
