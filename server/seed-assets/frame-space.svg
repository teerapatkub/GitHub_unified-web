<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="กรอบโปรไฟล์ธีมอวกาศ">
  <title>กรอบดาวเคราะห์ — Space Orbit Frame</title>
  <defs>
    <linearGradient id="spaceRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="spaceGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- ring: the centre stays fully transparent so an avatar shows through -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#spaceGlow)" stroke-width="3" opacity="0.55"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#spaceRing)" stroke-width="8"/>

  <!-- orbit sweep -->
  <ellipse cx="100" cy="100" rx="95" ry="40" fill="none" stroke="#a78bfa" stroke-width="2.5"
           opacity="0.8" transform="rotate(-28 100 100)" stroke-linecap="round"
           stroke-dasharray="150 60" stroke-dashoffset="30"/>

  <!-- planet riding the orbit -->
  <g transform="translate(168 62)">
    <circle r="12" fill="#7dd3fc"/>
    <circle r="12" fill="#38bdf8" opacity="0.5"/>
    <circle cx="-3" cy="-3" r="4" fill="#ffffff" opacity="0.9"/>
    <ellipse rx="19" ry="5.5" fill="none" stroke="#e9d5ff" stroke-width="2.5" transform="rotate(-20)"/>
  </g>

  <!-- small moon -->
  <circle cx="34" cy="146" r="7" fill="#c4b5fd"/>
  <circle cx="32" cy="144" r="2.4" fill="#ffffff" opacity="0.85"/>

  <!-- stars -->
  <g fill="#ffffff" stroke="#a78bfa" stroke-width="0.8">
    <path d="M42 44 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
    <path d="M160 148 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4 -5.6 -5.6 -2.4 5.6 -2.4 z"/>
    <path d="M100 12 l2 4.6 4.6 2 -4.6 2 -2 4.6 -2 -4.6 -4.6 -2 4.6 -2 z"/>
  </g>
  <g fill="#a78bfa">
    <circle cx="18" cy="92" r="2.2"/>
    <circle cx="182" cy="112" r="2"/>
    <circle cx="74" cy="188" r="2.2"/>
    <circle cx="128" cy="6" r="1.8"/>
  </g>
</svg>
