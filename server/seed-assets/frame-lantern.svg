<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="กรอบโปรไฟล์โคมทอง">
  <title>กรอบโคมทอง — Golden Lantern Frame</title>
  <!-- A gold ring with a Thai petal pattern. Two lanterns hang from it and
       swing, and sparks twinkle round it (SMIL). -->
  <defs>
    <linearGradient id="lfGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/><stop offset="45%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <path id="lfPetal" d="M0 -7 Q4 -2 0 6 Q-4 -2 0 -7Z"/>
    <g id="lfLantern">
      <path d="M0 0 V12" stroke="#92400e" stroke-width="1.6"/>
      <circle cy="26" r="18" fill="#fdba74" opacity="0.35"/>
      <path d="M-8 12 Q0 9 8 12 L10 22 Q12 32 8 38 Q0 41 -8 38 Q-12 32 -10 22Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
      <path d="M-4 12 V39 M4 12 V39" stroke="#fde68a" stroke-width="1" opacity="0.7"/>
      <rect x="-5" y="38" width="10" height="3" fill="#f59e0b"/>
      <path d="M0 41 V48 M-2 41 V46 M2 41 V46" stroke="#f59e0b" stroke-width="1.2"/>
    </g>
  </defs>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#78350f" stroke-width="14" opacity="0.35"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#lfGold)" stroke-width="10"/>
  <circle cx="100" cy="100" r="93" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="1 5" stroke-linecap="round"/>
  <g fill="#fffbeb" stroke="#b45309" stroke-width="0.8">
    <use href="#lfPetal" transform="translate(100 15)"/>
    <use href="#lfPetal" transform="translate(160 40) rotate(45)"/>
    <use href="#lfPetal" transform="translate(185 100) rotate(90)"/>
    <use href="#lfPetal" transform="translate(160 160) rotate(135)"/>
    <use href="#lfPetal" transform="translate(100 185) rotate(180)"/>
    <use href="#lfPetal" transform="translate(40 160) rotate(225)"/>
    <use href="#lfPetal" transform="translate(15 100) rotate(270)"/>
    <use href="#lfPetal" transform="translate(40 40) rotate(315)"/>
  </g>
  <g transform="translate(100 12)">
    <path d="M-16 6 Q-8 -14 0 -10 Q8 -14 16 6 Q0 0 -16 6Z" fill="url(#lfGold)" stroke="#92400e" stroke-width="1.5"/>
    <circle cy="-4" r="3.5" fill="#ef4444" stroke="#92400e" stroke-width="1"/>
  </g>
  <g transform="translate(36 146)">
    <g><use href="#lfLantern"/><animateTransform attributeName="transform" type="rotate" values="-10;10;-10" dur="2.6s" repeatCount="indefinite"/></g>
  </g>
  <g transform="translate(164 146)">
    <g><use href="#lfLantern"/><animateTransform attributeName="transform" type="rotate" values="8;-12;8" dur="2.9s" repeatCount="indefinite"/></g>
  </g>
  <g fill="#fde047" stroke="#b45309" stroke-width="0.6">
    <path d="M24 46 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2Z"><animate attributeName="opacity" values="0;1;0" dur="1.9s" repeatCount="indefinite"/></path>
    <path d="M170 18 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2Z"><animate attributeName="opacity" values="1;0;1" dur="2.3s" repeatCount="indefinite"/></path>
    <path d="M188 120 l1.5 -4.5 l1.5 4.5 l4.5 1.5 l-4.5 1.5 l-1.5 4.5 l-1.5 -4.5 l-4.5 -1.5Z"><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></path>
    <path d="M100 194 l1.5 -4.5 l1.5 4.5 l4.5 1.5 l-4.5 1.5 l-1.5 4.5 l-1.5 -4.5 l-4.5 -1.5Z"><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></path>
  </g>
</svg>
