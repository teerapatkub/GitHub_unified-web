<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="กรอบโปรไฟล์ปะการัง">
  <title>กรอบปะการังและเปลือกหอย — Coral Reef Frame</title>
  <!-- A sea-blue ring with coral, a shell and a starfish. Seaweed sways and
       bubbles rise beside the ring (SMIL). -->
  <defs>
    <linearGradient id="ofRing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5f3fc"/><stop offset="60%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#164e63" stroke-width="13" opacity="0.3"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#ofRing)" stroke-width="9"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-dasharray="12 18"/>
  <g transform="translate(36 184)" fill="#fb7185" stroke="#be123c" stroke-width="2" stroke-linejoin="round">
    <path d="M-4 0 V-24 Q-16 -30 -18 -44 Q-10 -42 -4 -32 V-46 Q-4 -56 2 -60 Q8 -56 6 -46 V-36 Q14 -46 22 -46 Q20 -32 6 -26 V0Z"/>
  </g>
  <g transform="translate(160 186)">
    <path d="M0 0 Q-20 -4 -18 -20 Q-10 -32 0 -32 Q10 -32 18 -20 Q20 -4 0 0Z" fill="#fecdd3" stroke="#e11d48" stroke-width="2"/>
    <path d="M0 -2 V-30 M0 -2 L-11 -26 M0 -2 L11 -26 M0 -2 L-16 -16 M0 -2 L16 -16" stroke="#e11d48" stroke-width="1.6"/>
  </g>
  <g transform="translate(166 38)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-12;12;-12" dur="4s" repeatCount="indefinite"/>
      <path d="M0 -16 L4.5 -5 L16 -5 L7 2.5 L10.5 14 L0 7.5 L-10.5 14 L-7 2.5 L-16 -5 L-4.5 -5Z" fill="#fb923c" stroke="#c2410c" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>
  <path d="M14 150 C6 130 20 118 12 98" fill="none" stroke="#14b8a6" stroke-width="5" stroke-linecap="round">
    <animate attributeName="d" values="M14 150 C6 130 20 118 12 98;M14 150 C22 130 6 118 16 98;M14 150 C6 130 20 118 12 98" dur="3.2s" repeatCount="indefinite"/>
  </path>
  <g fill="#ffffff" fill-opacity="0.4" stroke="#0891b2" stroke-width="1.6">
    <circle cx="188" cy="150" r="5"><animate attributeName="cy" values="160;30" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="194" cy="150" r="3"><animate attributeName="cy" values="170;50" dur="3.2s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="26" cy="80" r="4"><animate attributeName="cy" values="90;14" dur="3.6s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="0.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
