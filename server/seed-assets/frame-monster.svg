<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="กรอบโปรไฟล์มอนสเตอร์">
  <title>กรอบมอนสเตอร์กะพริบตา — Monster Frame</title>
  <!-- The centre stays transparent so the avatar shows through. The eyes blink
       and the horns wiggle with SMIL, which also runs inside an img tag. -->
  <defs>
    <linearGradient id="mfRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/><stop offset="55%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#a21caf"/>
    </linearGradient>
  </defs>
  <g stroke="#3b1f5c" stroke-width="3" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="rotate" values="0 100 100;-4 100 100;0 100 100;4 100 100;0 100 100" dur="2.4s" repeatCount="indefinite"/>
    <path d="M58 32 Q40 4 34 10 Q38 30 48 42Z" fill="#fde68a"/>
    <path d="M142 32 Q160 4 166 10 Q162 30 152 42Z" fill="#fde68a"/>
  </g>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#3b1f5c" stroke-width="15"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#mfRing)" stroke-width="10"/>
  <g fill="#ede9fe" opacity="0.9">
    <circle cx="30" cy="120" r="3"/><circle cx="170" cy="120" r="3"/><circle cx="46" cy="160" r="2.6"/>
    <circle cx="154" cy="160" r="2.6"/><circle cx="18" cy="96" r="2.2"/><circle cx="182" cy="96" r="2.2"/>
  </g>
  <g stroke="#3b1f5c" stroke-width="3" fill="#ffffff">
    <ellipse cx="76" cy="22" rx="14" ry="14">
      <animate attributeName="ry" values="14;14;1.5;14;14" keyTimes="0;0.86;0.9;0.94;1" dur="3.6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="124" cy="22" rx="14" ry="14">
      <animate attributeName="ry" values="14;14;1.5;14;14" keyTimes="0;0.86;0.9;0.94;1" dur="3.6s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <g fill="#3b1f5c">
    <circle cx="79" cy="24" r="6"><animate attributeName="r" values="6;6;0;6;6" keyTimes="0;0.86;0.9;0.94;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="127" cy="24" r="6"><animate attributeName="r" values="6;6;0;6;6" keyTimes="0;0.86;0.9;0.94;1" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#ffffff" stroke="#3b1f5c" stroke-width="2.5" stroke-linejoin="round">
    <path d="M84 180 L92 196 L100 182Z"/><path d="M100 182 L108 196 L116 180Z"/>
  </g>
  <g fill="#8b5cf6" stroke="#3b1f5c" stroke-width="3">
    <ellipse cx="44" cy="176" rx="16" ry="9"/><ellipse cx="156" cy="176" rx="16" ry="9"/>
  </g>
  <g fill="#f9a8d4" opacity="0.8"><ellipse cx="44" cy="44" rx="8" ry="5"/><ellipse cx="156" cy="44" rx="8" ry="5"/></g>
</svg>
