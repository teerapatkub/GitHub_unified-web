<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="รูปโปรไฟล์นักไพธอนครึ่งร้อย (รางวัลเลเวล 50)">
  <!-- Level 50 reward, not for sale: a silver python coiled round a "50"
       medal, in the same flat style as the other achievement pictures. -->
  <defs>
    <linearGradient id="a50Bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a3b8"/><stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="a50Snake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bbf7d0"/><stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" fill="url(#a50Bg)"/>
  <circle cx="20" cy="22" r="2.5" fill="#f8fafc"/><circle cx="108" cy="28" r="2" fill="#f8fafc"/><circle cx="100" cy="104" r="2.5" fill="#f8fafc"/>
  <!-- medal -->
  <circle cx="64" cy="70" r="30" fill="#e2e8f0" stroke="#f8fafc" stroke-width="4"/>
  <circle cx="64" cy="70" r="22" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 4"/>
  <text x="64" y="79" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="24" font-weight="900" fill="#334155">50</text>
  <!-- python coiled over the medal -->
  <path d="M86 110 C56 116 24 104 24 72 C24 44 46 30 70 32 C78 32 84 30 86 28" fill="none" stroke="url(#a50Snake)" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="88" cy="26" rx="10" ry="8" fill="#22c55e" stroke="#14532d" stroke-width="2"/>
  <circle cx="91" cy="24" r="2" fill="#14532d"/>
  <path d="M97 27 l6 1 m-6 -1 l5 4" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round"/>
</svg>
