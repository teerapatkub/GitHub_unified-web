<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="กรอบเลเวล 100">
  <title>กรอบเพชร Lv.100 — Diamond Level Frame</title>
  <!-- The top level reward, not for sale. A rainbow-diamond ring that turns,
       eight diamonds orbiting it, a halo of light and a "100" crest (SMIL). -->
  <defs>
    <linearGradient id="l100Ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/><stop offset="25%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#f472b6"/><stop offset="75%" stop-color="#fde047"/><stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="l100Halo" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#e0e7ff" stop-opacity="0"/>
      <stop offset="90%" stop-color="#c4b5fd" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <path id="l100Gem" d="M0 -8 L6 -2 L0 8 L-6 -2Z"/>
  </defs>
  <circle cx="100" cy="100" r="99" fill="url(#l100Halo)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#312e81" stroke-width="15" opacity="0.45"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="8s" repeatCount="indefinite"/>
    <circle cx="100" cy="100" r="85" fill="none" stroke="url(#l100Ring)" stroke-width="10"/>
  </g>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 9" opacity="0.8"/>
  <!-- orbiting diamonds -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="-360 100 100" dur="14s" repeatCount="indefinite"/>
    <g fill="#e0f2fe" stroke="#4338ca" stroke-width="1.2" stroke-linejoin="round">
      <use href="#l100Gem" transform="translate(100 7)"/>
      <use href="#l100Gem" transform="translate(166 34) rotate(45)"/>
      <use href="#l100Gem" transform="translate(193 100) rotate(90)"/>
      <use href="#l100Gem" transform="translate(166 166) rotate(135)"/>
      <use href="#l100Gem" transform="translate(34 166) rotate(225)"/>
      <use href="#l100Gem" transform="translate(7 100) rotate(270)"/>
      <use href="#l100Gem" transform="translate(34 34) rotate(315)"/>
    </g>
  </g>
  <!-- crest -->
  <g transform="translate(100 180)">
    <path d="M-30 -14 H30 L36 0 L30 14 H-30 L-36 0Z" fill="#312e81" stroke="url(#l100Ring)" stroke-width="3"/>
    <text x="0" y="6" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="17" font-weight="900" fill="#ffffff">100</text>
  </g>
  <g fill="#ffffff">
    <path d="M22 54 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2Z"><animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M176 52 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2Z"><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></path>
    <path d="M182 140 l1.5 -4.5 l1.5 4.5 l4.5 1.5 l-4.5 1.5 l-1.5 4.5 l-1.5 -4.5 l-4.5 -1.5Z"><animate attributeName="opacity" values="0;1;0" dur="1.3s" begin="0.4s" repeatCount="indefinite"/></path>
  </g>
</svg>
