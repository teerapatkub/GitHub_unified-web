<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="รูปโปรไฟล์ปรมาจารย์ไพธอน (รางวัลเลเวล 100)">
  <!-- Level 100 reward, not for sale: a crowned golden python on a starry
       violet sky, "100" on its gem. -->
  <defs>
    <linearGradient id="a100Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/><stop offset="0.6" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="a100Gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef08a"/><stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" fill="url(#a100Bg)"/>
  <g fill="#fef9c3">
    <circle cx="16" cy="18" r="1.8"/><circle cx="34" cy="10" r="1.2"/><circle cx="112" cy="16" r="1.8"/>
    <circle cx="118" cy="52" r="1.2"/><circle cx="10" cy="60" r="1.4"/><circle cx="104" cy="112" r="1.6"/>
    <path d="M24 100 l1.5 -4 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5Z"/>
  </g>
  <!-- golden python coiled into an S -->
  <path d="M30 108 C30 90 62 96 64 80 C66 64 34 66 38 50 C42 36 70 38 78 48" fill="none" stroke="url(#a100Gold)" stroke-width="12" stroke-linecap="round"/>
  <path d="M30 108 C30 90 62 96 64 80 C66 64 34 66 38 50 C42 36 70 38 78 48" fill="none" stroke="#a16207" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
  <!-- head -->
  <ellipse cx="86" cy="54" rx="15" ry="12" fill="url(#a100Gold)" stroke="#713f12" stroke-width="2.5"/>
  <circle cx="91" cy="51" r="3" fill="#1e1b4b"/><circle cx="92" cy="50" r="1" fill="#ffffff"/>
  <path d="M100 56 l7 1 m-7 -1 l6 4" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <!-- crown -->
  <path d="M74 42 L72 28 L80 34 L86 24 L92 34 L100 28 L98 42Z" fill="url(#a100Gold)" stroke="#713f12" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="86" cy="24" r="2.5" fill="#f472b6"/>
  <!-- gem with 100 -->
  <g transform="translate(64 100)">
    <path d="M-22 -10 H22 L28 0 L0 18 L-28 0Z" fill="#a5f3fc" stroke="#0e7490" stroke-width="2" stroke-linejoin="round"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="13" font-weight="900" fill="#0e7490">100</text>
  </g>
</svg>
