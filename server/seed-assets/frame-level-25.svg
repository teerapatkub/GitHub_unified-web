<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="กรอบเลเวล 25">
  <title>กรอบทองแดง Lv.25 — Bronze Level Frame</title>
  <!-- Level reward, not for sale. A bronze ring with a shield badge "25" at
       the bottom; the centre stays transparent for the avatar. -->
  <defs>
    <linearGradient id="l25Ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/><stop offset="45%" stop-color="#c2703d"/><stop offset="100%" stop-color="#7c3a12"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#5c2a0c" stroke-width="15" opacity="0.4"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#l25Ring)" stroke-width="10"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#fed7aa" stroke-width="1.5" opacity="0.7"/>
  <!-- rivets -->
  <g fill="#fde3c8" stroke="#7c3a12" stroke-width="1">
    <circle cx="100" cy="15" r="3.5"/><circle cx="185" cy="100" r="3.5"/><circle cx="15" cy="100" r="3.5"/>
    <circle cx="40" cy="40" r="3"/><circle cx="160" cy="40" r="3"/>
  </g>
  <!-- shield badge -->
  <g transform="translate(100 176)">
    <path d="M-20 -18 H20 V2 Q20 16 0 24 Q-20 16 -20 2Z" fill="url(#l25Ring)" stroke="#5c2a0c" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="17" font-weight="900" fill="#fff7ed" stroke="#5c2a0c" stroke-width="0.8">25</text>
  </g>
</svg>
