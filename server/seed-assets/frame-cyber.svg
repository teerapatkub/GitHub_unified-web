<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-label="กรอบโปรไฟล์ธีมไซเบอร์">
  <title>กรอบวงจรนีออน — Neon Circuit Frame</title>
  <!--
    Round like the Space and Sakura frames so the set still looks like it
    belongs, but the ring is broken into arc segments with solder pads at the
    breaks - a circuit routed around the avatar rather than a solid band. The
    centre stays fully transparent.
  -->
  <defs>
    <linearGradient id="cyRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="50%"  stop-color="#e11d8f"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cyHalo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#67e8f9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- outer halo -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#cyHalo)" stroke-width="3" opacity="0.5"/>

  <!-- the ring itself, cut into four arcs. The dash pattern is the cut: each
       run of 92 draws an arc, each gap of 37 is where a pad sits. -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#cyRing)" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="92 37" stroke-dashoffset="46"/>

  <!-- a thinner counter-ring, offset so its gaps fall on the other ring's arcs
       and the eye reads two layers rather than one broken one -->
  <circle cx="100" cy="100" r="71" fill="none" stroke="#22d3ee" stroke-width="2"
          stroke-linecap="round" stroke-dasharray="26 44" opacity="0.55"/>

  <!-- solder pads at the four cuts -->
  <g>
    <g transform="translate(100 18)">
      <circle r="8" fill="#ffffff" stroke="#22d3ee" stroke-width="2.5"/>
      <circle r="3.2" fill="#e11d8f"/>
    </g>
    <g transform="translate(182 100)">
      <circle r="8" fill="#ffffff" stroke="#22d3ee" stroke-width="2.5"/>
      <circle r="3.2" fill="#e11d8f"/>
    </g>
    <g transform="translate(100 182)">
      <circle r="8" fill="#ffffff" stroke="#22d3ee" stroke-width="2.5"/>
      <circle r="3.2" fill="#e11d8f"/>
    </g>
    <g transform="translate(18 100)">
      <circle r="8" fill="#ffffff" stroke="#22d3ee" stroke-width="2.5"/>
      <circle r="3.2" fill="#e11d8f"/>
    </g>
  </g>

  <!-- short traces leaving each pad outwards, so the frame looks wired into
       something rather than free-floating -->
  <g fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"
     stroke-linejoin="round" opacity="0.75">
    <path d="M100 10 V2"/>
    <path d="M190 100 H198"/>
    <path d="M100 190 V198"/>
    <path d="M10 100 H2"/>
    <path d="M141 29 l10 -10 h14"/>
    <path d="M59 171 l-10 10 h-14"/>
    <path d="M171 141 l10 10 v14"/>
    <path d="M29 59 l-10 -10 v-14"/>
  </g>

  <!-- corner brackets, the HUD convention for "this thing is targeted" -->
  <g fill="none" stroke="#e11d8f" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M8 34 V14 H28"/>
    <path d="M192 34 V14 H172"/>
    <path d="M8 166 V186 H28"/>
    <path d="M192 166 V186 H172"/>
  </g>

  <!-- a few live-signal dots on the ring -->
  <g fill="#22d3ee">
    <circle cx="152" cy="48" r="2.6"/>
    <circle cx="48" cy="152" r="2.6"/>
    <circle cx="154" cy="150" r="2.2" fill="#e11d8f"/>
    <circle cx="46" cy="50" r="2.2" fill="#a855f7"/>
  </g>
</svg>
