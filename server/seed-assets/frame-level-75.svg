<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="กรอบเลเวล 75">
  <title>กรอบทอง Lv.75 — Gold Level Frame</title>
  <!-- Level reward, not for sale. A double gold ring with a laurel wreath,
       a crown on top and a "75" ribbon; the laurel glints (SMIL). -->
  <defs>
    <linearGradient id="l75Gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/><stop offset="40%" stop-color="#facc15"/><stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <path id="l75Leaf" d="M0 0 C4 -5 12 -6 16 0 C12 6 4 5 0 0Z"/>
  </defs>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#713f12" stroke-width="15" opacity="0.4"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#l75Gold)" stroke-width="10"/>
  <circle cx="100" cy="100" r="93" fill="none" stroke="#eab308" stroke-width="2"/>
  <!-- laurel along both lower sides -->
  <g fill="#65a30d" stroke="#365314" stroke-width="1">
    <use href="#l75Leaf" transform="translate(22 128) rotate(-60)"/>
    <use href="#l75Leaf" transform="translate(30 146) rotate(-40)"/>
    <use href="#l75Leaf" transform="translate(44 162) rotate(-20)"/>
    <use href="#l75Leaf" transform="translate(178 128) rotate(240)"/>
    <use href="#l75Leaf" transform="translate(170 146) rotate(220)"/>
    <use href="#l75Leaf" transform="translate(156 162) rotate(200)"/>
  </g>
  <!-- crown -->
  <g transform="translate(100 16)">
    <path d="M-20 8 L-22 -10 L-10 -2 L0 -16 L10 -2 L22 -10 L20 8Z" fill="url(#l75Gold)" stroke="#713f12" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="0" cy="-16" r="3" fill="#ef4444"/><circle cx="-22" cy="-10" r="2.5" fill="#3b82f6"/><circle cx="22" cy="-10" r="2.5" fill="#3b82f6"/>
  </g>
  <!-- ribbon -->
  <g transform="translate(100 182)">
    <path d="M-34 -10 H34 L28 0 L34 10 H-34 L-28 0Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>
    <rect x="-22" y="-13" width="44" height="24" rx="6" fill="url(#l75Gold)" stroke="#713f12" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="16" font-weight="900" fill="#713f12">75</text>
  </g>
  <g fill="#fffbeb">
    <path d="M36 70 l2 -5 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2Z"><animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/></path>
    <path d="M160 64 l2 -5 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2Z"><animate attributeName="opacity" values="1;0;1" dur="2.2s" repeatCount="indefinite"/></path>
  </g>
</svg>
